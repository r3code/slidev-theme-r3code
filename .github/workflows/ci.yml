name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    name: Lint theme structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-frozen-lockfile

      - name: Lint
        run: npm run lint

  build:
    name: Build example.md
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build example.md
        # Проверяет что тема собирается без ошибок
        run: pnpm run build

      - name: Install Chromium for export
        # export прогоняет каждый слайд через headless-chromium
        run: npx playwright install --with-deps chromium

      - name: Export example.md (render smoke)
        # Проверяет что все layouts реально рендерятся
        run: pnpm run export:pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: example-pdf
          path: example-export.pdf
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # continue-on-error: GitHub Pages должен быть включён в настройках репо
    # (Settings → Pages → Source: GitHub Actions). Пока не включён — деплой упадёт,
    # но это не должен ломать весь CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build for GitHub Pages
        # --base нужен, потому что GitHub Pages проектного репозитория
        # живёт по пути /slidev-theme-r3code/, а не в корне /
        run: pnpm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
