<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- r3code favicon — векторная версия логотипа
       Чёрная "T" + синий swoosh (checkmark) на белом фоне
       Квадратный, одинаково читается в светлой и тёмной теме -->

  <!-- Белый фон (для тёмной темы) -->
  <rect width="64" height="64" rx="8" fill="#ffffff"/>

  <!-- Чёрная "T" — стилизованная, как в логотипе -->
  <!-- Горизонтальная перекладина -->
  <rect x="12" y="12" width="28" height="8" fill="#000000"/>
  <!-- Вертикальная стойка -->
  <rect x="22" y="12" width="8" height="40" fill="#000000"/>

  <!-- Синий swoosh / checkmark — диагональная линия движения -->
  <path d="M 8 48 Q 20 38 34 30 Q 46 24 56 20 L 56 26 Q 48 28 38 34 Q 26 40 14 52 Z" fill="#0064fb"/>

  <!-- Текст "code" — миниатюрный, справа снизу -->
  <text x="34" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="9" fill="#0064fb" letter-spacing="0.5">code</text>
</svg>
