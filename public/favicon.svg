<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- r3code favicon — векторная версия логотипа с r3code.ru
       Чёрная строчная «r» с засечками (нижний слой)
       + Синяя «r» поверх (верхний слой, смещена)
       = визуально «rr» = «r3»
       Белый фон — одинаково читается в светлой и тёмной теме -->

  <!-- Белый фон -->
  <rect width="128" height="128" fill="#ffffff"/>

  <!-- Чёрная строчная «r» с засечками (нижний слой, больше) -->
  <g fill="#000000">
    <!-- Вертикальная стойка с засечками -->
    <!-- Нижняя засечка (слева и справа от стойки) -->
    <rect x="20" y="104" width="36" height="6"/>
    <!-- Основная вертикальная стойка -->
    <rect x="28" y="30" width="14" height="80"/>
    <!-- Верхняя засечка слева -->
    <rect x="20" y="28" width="16" height="6"/>
    <!-- Плечо (shoulder) — изгиб в верхней правой части -->
    <path d="M 42 30 Q 60 30 68 44 Q 74 54 70 66 L 56 66 Q 58 56 54 50 Q 50 44 42 44 Z"/>
  </g>

  <!-- Синяя «r» поверх (верхний слой, смещена вправо-вниз, чуть меньше) -->
  <g fill="#0064fb" transform="translate(28, 18) scale(0.85)">
    <!-- Нижняя засечка -->
    <rect x="20" y="104" width="36" height="6"/>
    <!-- Вертикальная стойка -->
    <rect x="28" y="30" width="14" height="80"/>
    <!-- Верхняя засечка слева -->
    <rect x="20" y="28" width="16" height="6"/>
    <!-- Плечо -->
    <path d="M 42 30 Q 60 30 68 44 Q 74 54 70 66 L 56 66 Q 58 56 54 50 Q 50 44 42 44 Z"/>
  </g>
</svg>
